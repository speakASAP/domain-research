apiVersion: batch/v1
kind: CronJob
metadata:
  name: domain-research-notification-dispatch
  namespace: statex-apps
  labels:
    app: domain-research
    component: notification-dispatch
    managed-by: k8s-migration
spec:
  # Staggered off the :00/:15/:30/:45 marks shared by several other cronjobs.
  # See shared/docs/DEPLOY_STANDARDIZATION_REPORT.md section 12 addendum.
  schedule: "9-59/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: domain-research
            component: notification-dispatch
        spec:
          restartPolicy: Never
          containers:
            - name: notification-dispatch
              image: localhost:5000/domain-research:latest
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: domain-research-config
                - secretRef:
                    name: domain-research-secret
              command: ["node", "-e"]
              args:
                - |
                  (async () => {
                    // Auth-issued per-pair RS256 Bearer (Vault DOMAIN_RESEARCH_JOBS_SERVICE_TOKEN).
                    // Role: internal:domain-research:jobs. Fail closed if unset — no HS256 mint.
                    const baseUrl = 'http://domain-research:4860';
                    const token = (process.env.DOMAIN_RESEARCH_JOBS_SERVICE_TOKEN || '').trim();
                    if (!token) throw new Error('DOMAIN_RESEARCH_JOBS_SERVICE_TOKEN is required');
                    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
                    const requestDispatch = async () => fetch(`${baseUrl}/api/internal/jobs/notification-dispatch/run-due`, {
                      method: "POST",
                      headers: { authorization: `Bearer ${token}`, "content-type": "application/json" },
                      body: JSON.stringify({ limit: 100 }),
                    });
                    let response;
                    let lastError;
                    for (const delayMs of [0, 5000, 10000, 20000, 30000, 45000]) {
                      if (delayMs > 0) await sleep(delayMs);
                      try {
                        response = await requestDispatch();
                        break;
                      } catch (error) {
                        lastError = error;
                        console.error(`notification dispatch request failed; retrying after transient network error: ${error.message}`);
                      }
                    }
                    if (!response) throw lastError;
                    const payload = await response.json();
                    console.log(JSON.stringify(payload));
                    if (!response.ok || payload.failed > 0) throw new Error(`notification dispatch failed: ${JSON.stringify(payload)}`);
                  })().catch((error) => { console.error(error); process.exit(1); });
