apiVersion: apps/v1
kind: Deployment
metadata:
  name: domain-research
  namespace: statex-apps
  labels:
    app: domain-research
    managed-by: k8s-migration
spec:
  # Single node, 110-pod ceiling: a second replica of a service with no
  # HA requirement buys nothing (both pods sit on the same node, so it is not
  # fault tolerance) and costs a slot that rollouts need for their surge pod.
  replicas: 1
  selector:
    matchLabels:
      app: domain-research
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxSurge 0: scaled to 1 replica on 2026-08-03 (both replicas sat on the
      # same single node, so it was never fault tolerance). With maxUnavailable 0
      # a 1-replica deployment still needs a free pod slot to roll, on a node
      # that hit its 110-pod ceiling mid-deploy. Rolling in place needs none.
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: domain-research
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z db-server-postgres 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: app
          image: localhost:5000/domain-research:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4860
              name: http
          envFrom:
            - configMapRef:
                name: domain-research-config
            - secretRef:
                name: domain-research-secret
          startupProbe:
            httpGet:
              path: /health
              port: 4860
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4860
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 4860
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
